plugins {
    id 'idea'
    id 'java'
    id 'groovy'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.github.ben-manes.versions' version '0.54.0'
}

repositories {
    mavenCentral()
}

apply plugin: 'java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    // updated testing libraries
    testImplementation "org.junit.platform:junit-platform-launcher:6.1.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.1.2"
    testImplementation "org.junit.jupiter:junit-jupiter-params:6.1.2"
    testImplementation "org.hamcrest:hamcrest:3.0"
    testImplementation "org.mockito:mockito-core:5.20.0"

    // runtime libraries - bumped to recent stable versions where compatible
    implementation "org.apache.groovy:groovy:5.0.6"
    implementation "org.springframework:spring-context:7.0.8"
    implementation "de.siegmar:fastcsv:4.3.1"
    implementation "commons-validator:commons-validator:1.10.1"
    implementation "de.jensd:fontawesomefx-commons:9.1.2"
    implementation "de.jensd:fontawesomefx-fontawesome:4.7.0-9.1.2"
    implementation "de.jensd:fontawesomefx-materialdesignfont:2.0.26-9.1.2"
    implementation "de.jensd:fontawesomefx-materialicons:2.2.0-9.1.2"
    implementation "org.controlsfx:controlsfx:11.2.3"
    implementation "com.google.code.gson:gson:2.14.0"
    implementation "org.apache.logging.log4j:log4j-api:2.26.1"
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation "org.fxmisc.richtext:richtextfx:0.11.7"
}

test {
    useJUnitPlatform()
}

group 'ninja.javafx'
version '1.6.0'

application {
    mainClass = 'ninja.javafx.smartcsv.Main'
    applicationDefaultJvmArgs = ["--enable-native-access=javafx.graphics"]
}
